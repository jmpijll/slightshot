name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable:
    name: Portable checks (Linux)
    # PRs always use hosted runners; Unraid only handles trusted pushes/manual runs.
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && vars.LINUX_CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '10.0.x'
      - name: Lint workflows and shell scripts
        run: |
          tools="$RUNNER_TEMP/lint-tools"
          mkdir -p "$tools"
          cd "$tools"
          curl -sSfLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -sSfLO https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
          sha256sum -c - <<'EOF'
          8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz
          b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6  shellcheck-v0.11.0.linux.x86_64.tar.gz
          EOF
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          tar -xzf shellcheck-v0.11.0.linux.x86_64.tar.gz --strip-components=1 shellcheck-v0.11.0/shellcheck
          cd "$GITHUB_WORKSPACE"
          PATH="$tools:$PATH"
          shellcheck --version
          shellcheck Scripts/*.sh
          actionlint -shellcheck "$tools/shellcheck"
      - name: Test notarisation release gates
        run: python3 -m unittest discover -s Tests -v
      - name: Test selection, layout and output geometry
        run: dotnet run --project Windows/Slightshot.Core.Tests -c Release
      - name: Cross-build Windows app
        run: dotnet build Windows/Slightshot -c Release

  build:
    name: Mac build, media tests, lint and DMG
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Test notarisation release gates
        run: python3 -m unittest discover -s Tests -v

      - name: Verify shared icon assets
        run: python3 Scripts/generate_ui_icons.py --check

      - name: Build
        run: swift build -c release

      - name: Test recording export
        env:
          NSUnbufferedIO: 'YES'
        run: swift test

      - name: Assemble app bundle (ad-hoc signed)
        run: SIGN_IDENTITY=- VERSION=0.0.0-ci BUILD=${{ github.run_number }} ./Scripts/bundle.sh

      - name: Verify bundle
        run: |
          codesign --verify --deep --strict --verbose=2 build/Slightshot.app
          plutil -lint build/Slightshot.app/Contents/Info.plist
          build/Slightshot.app/Contents/MacOS/Slightshot --verify-runtime-linkage

      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint --strict --quiet

      - name: Package review disk image
        run: DMG_LAYOUT=plain SIGN_IDENTITY=- ./Scripts/make_dmg.sh

      - name: Verify disk image
        run: hdiutil verify build/Slightshot-0.0.0-ci.dmg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Slightshot-macos-review-dmg
          path: build/Slightshot-0.0.0-ci.dmg
          if-no-files-found: error
          retention-days: 7
