name: Windows
on:
  push:
    paths: ['Windows/**', 'Resources/UI/**', 'Scripts/generate_ui_icons.py', 'Scripts/package_windows.py', 'Scripts/build_windows_installer.ps1', 'Scripts/test_windows_installer.ps1', 'Tests/test_windows_package.py', '.github/workflows/windows.yml']
  pull_request:
    paths: ['Windows/**', 'Resources/UI/**', 'Scripts/generate_ui_icons.py', 'Scripts/package_windows.py', 'Scripts/build_windows_installer.ps1', 'Scripts/test_windows_installer.ps1', 'Tests/test_windows_package.py', '.github/workflows/windows.yml']
  workflow_dispatch:
    inputs:
      version:
        description: Optional app version (defaults to the project version)
        type: string
        required: false
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      release_assets:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build-and-render:
    # Release callers request download assets; feature branches use their PR run.
    if: inputs.release_assets || github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Resolve app version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:REQUESTED_VERSION
          if (!$version -and $env:GITHUB_REF.StartsWith('refs/tags/v')) {
            $version = $env:GITHUB_REF.Substring('refs/tags/v'.Length)
          }
          if (!$version) {
            $version = ([xml](Get-Content Windows/Slightshot/Slightshot.csproj)).Project.PropertyGroup.Version
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Version must be MAJOR.MINOR.PATCH' }
          "WINDOWS_VERSION=$version" >> $env:GITHUB_ENV
      - name: Verify shared icon assets
        run: python Scripts/generate_ui_icons.py --check
      - name: Test portable archive layout and architecture gates
        run: python -m unittest discover -s Tests -p test_windows_package.py -v
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test selection, layout and output geometry
        run: dotnet run --project Windows/Slightshot.Core.Tests -c Release
      - name: Build native app with warnings as errors
        run: dotnet build Windows/Slightshot -c Release -p:Version="$env:WINDOWS_VERSION"
      - name: Render native WPF parity fixtures and test image export
        shell: pwsh
        run: |
          $app = Resolve-Path Windows/Slightshot/bin/Release/net10.0-windows10.0.19041.0/Slightshot.exe
          $output = Join-Path $PWD Windows/artifacts/parity
          $process = Start-Process $app -ArgumentList '--smoke-test', $output -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Native WPF smoke test failed with exit code $($process.ExitCode)" }
          Get-Content "$output/validation.json"
      - name: Test clipboard image editor, native window, original pixels and output retry
        shell: pwsh
        run: |
          $app = Resolve-Path Windows/Slightshot/bin/Release/net10.0-windows10.0.19041.0/Slightshot.exe
          $output = Join-Path $PWD Windows/artifacts/clipboard
          $process = Start-Process $app -ArgumentList '--clipboard-smoke-test', $output -PassThru
          if (!$process.WaitForExit(60000)) { $process.Kill(); throw 'Clipboard editor smoke test timed out' }
          if ($process.ExitCode -ne 0) { Get-Content "$output/clipboard-failure.txt" -ErrorAction SilentlyContinue; throw "Clipboard editor smoke test failed with exit code $($process.ExitCode)" }
          Get-Content "$output/clipboard-validation.json"
      - name: Test native video recording, export quality, cancellation and retry
        shell: pwsh
        run: |
          $app = Resolve-Path Windows/Slightshot/bin/Release/net10.0-windows10.0.19041.0/Slightshot.exe
          $output = Join-Path $PWD Windows/artifacts/recording
          $process = Start-Process $app -ArgumentList '--recording-smoke-test', $output -PassThru
          if (!$process.WaitForExit(180000)) { $process.Kill(); throw 'Native recording smoke test timed out' }
          if ($process.ExitCode -ne 0) { Get-Content "$output/recording-failure.txt" -ErrorAction SilentlyContinue; throw "Native recording smoke test failed with exit code $($process.ExitCode)" }
          Get-Content "$output/recording-validation.json"
      - name: Test delayed capture on the real Windows desktop
        shell: pwsh
        run: |
          $app = Resolve-Path Windows/Slightshot/bin/Release/net10.0-windows10.0.19041.0/Slightshot.exe
          $output = Join-Path $PWD Windows/artifacts/delayed-capture
          $process = Start-Process $app -ArgumentList '--delayed-capture-smoke-test', $output -PassThru
          if (!$process.WaitForExit(45000)) { $process.Kill(); throw 'Delayed capture smoke test timed out' }
          if ($process.ExitCode -ne 0) { Get-Content "$output/delayed-capture-failure.txt" -ErrorAction SilentlyContinue; throw "Delayed capture smoke test failed: $($process.ExitCode)" }
          Get-Content "$output/delayed-capture-validation.json"
      - name: Publish portable x64 app
        run: dotnet publish Windows/Slightshot -c Release -r win-x64 -p:PublishProfile=Portable -o Windows/artifacts/win-x64 -p:Version="$env:WINDOWS_VERSION"
      - name: Publish portable ARM64 app
        run: dotnet publish Windows/Slightshot -c Release -r win-arm64 -p:PublishProfile=Portable -o Windows/artifacts/win-arm64 -p:Version="$env:WINDOWS_VERSION"
      - name: Package and verify single-file archives
        shell: pwsh
        run: |
          foreach ($arch in @('x64', 'arm64')) {
            $archive = "Windows/artifacts/Slightshot-windows-$arch.zip"
            python Scripts/package_windows.py "Windows/artifacts/win-$arch" $archive --architecture $arch
            if ($LASTEXITCODE -ne 0) { throw "Packaging $arch failed" }
            $extracted = "Windows/artifacts/extracted $arch"
            Expand-Archive -Path $archive -DestinationPath $extracted
            $entries = @(Get-ChildItem $extracted -Force)
            if ($entries.Count -ne 1 -or $entries[0].Name -ne 'Slightshot.exe' -or $entries[0].PSIsContainer) {
              throw "$arch archive must contain only Slightshot.exe"
            }
            $app = Get-Item "$extracted/Slightshot.exe"
            if ($app.VersionInfo.ProductVersion.Split('+')[0] -ne $env:WINDOWS_VERSION) {
              throw "Wrong $arch app version: $($app.VersionInfo.ProductVersion)"
            }
            Write-Output "$arch app: $($app.VersionInfo.ProductVersion)"
          }
      - name: Test the extracted x64 app from a path containing spaces
        shell: pwsh
        run: |
          $app = Resolve-Path 'Windows/artifacts/extracted x64/Slightshot.exe'
          $tests = @(
            @{ Argument = '--smoke-test'; Directory = 'parity/portable'; Report = 'validation.json'; Failure = 'failure.txt' },
            @{ Argument = '--recording-smoke-test'; Directory = 'recording/portable'; Report = 'recording-validation.json'; Failure = 'recording-failure.txt' }
          )
          foreach ($test in $tests) {
            $output = Join-Path $PWD "Windows/artifacts/$($test.Directory)"
            $process = Start-Process $app -ArgumentList $test.Argument, ('"{0}"' -f $output) -PassThru
            if (!$process.WaitForExit(180000)) { $process.Kill(); throw "Extracted x64 $($test.Argument) timed out" }
            if ($process.ExitCode -ne 0) {
              Get-Content "$output/$($test.Failure)" -ErrorAction SilentlyContinue
              throw "Extracted x64 $($test.Argument) failed with exit code $($process.ExitCode)"
            }
            Get-Content "$output/$($test.Report)"
          }
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $download
          $expected = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          if ((Get-FileHash $download -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Inno Setup compiler download checksum mismatch'
          }
          if ((Get-AuthenticodeSignature $download).Status -ne 'Valid') {
            throw 'Inno Setup compiler download signature is invalid'
          }
          $compilerDir = Join-Path $env:RUNNER_TEMP 'Inno Setup 7'
          $process = Start-Process $download -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', ('/DIR="{0}"' -f $compilerDir) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
          $compiler = Join-Path $compilerDir 'ISCC.exe'
          if (!(Test-Path $compiler)) { throw 'Inno Setup compiler not found' }
          "INNO_COMPILER=$compiler" >> $env:GITHUB_ENV
      - name: Build per-user Windows installers
        shell: pwsh
        run: |
          foreach ($arch in @('x64', 'arm64')) {
            ./Scripts/build_windows_installer.ps1 -Runtime "win-$arch" -Version $env:WINDOWS_VERSION -PublishDirectory "Windows/artifacts/win-$arch" -OutputDirectory Windows/artifacts/installers -CompilerPath $env:INNO_COMPILER
          }
      - name: Build older-version fixture for upgrade and downgrade checks
        shell: pwsh
        run: |
          dotnet publish Windows/Slightshot -c Release -r win-x64 -p:PublishProfile=Portable -p:Version=0.0.0 -o Windows/artifacts/installer-upgrade-fixture
          if ($LASTEXITCODE -ne 0) { throw 'Older-version fixture publish failed' }
          ./Scripts/build_windows_installer.ps1 -Runtime win-x64 -Version 0.0.0 -PublishDirectory Windows/artifacts/installer-upgrade-fixture -OutputDirectory Windows/artifacts/installer-fixtures -CompilerPath $env:INNO_COMPILER
      - name: Test installation, upgrade, installed app and uninstallation
        shell: pwsh
        run: |
          ./Scripts/test_windows_installer.ps1 -InstallerPath Windows/artifacts/installers/Slightshot-windows-x64-setup.exe -PreviousInstallerPath Windows/artifacts/installer-fixtures/Slightshot-windows-x64-setup.exe -Version $env:WINDOWS_VERSION -OutputDirectory Windows/artifacts/installer-evidence
      - name: Stage verified release downloads
        shell: pwsh
        run: |
          $destination = 'Windows/artifacts/release-assets'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          foreach ($arch in @('x64', 'arm64')) {
            Copy-Item "Windows/artifacts/Slightshot-windows-$arch.zip" $destination
            Copy-Item "Windows/artifacts/installers/Slightshot-windows-$arch-setup.exe" $destination
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 7
          name: windows-native-delayed-capture-evidence
          path: Windows/artifacts/delayed-capture
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.release_assets
        with:
          retention-days: 7
          name: Slightshot-windows-release-assets
          path: Windows/artifacts/release-assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 7
          name: windows-installer-evidence
          path: Windows/artifacts/installer-evidence
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.release_assets }}
        with:
          retention-days: 7
          name: Slightshot-windows-installers
          path: Windows/artifacts/installers/Slightshot-windows-*-setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 7
          name: windows-native-parity-evidence
          path: Windows/artifacts/parity
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 7
          name: windows-native-recording-evidence
          path: Windows/artifacts/recording
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 7
          name: windows-native-clipboard-evidence
          path: Windows/artifacts/clipboard
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.release_assets }}

        with:
          retention-days: 7
          name: Slightshot-windows-x64
          path: Windows/artifacts/win-x64
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.release_assets }}
        with:
          retention-days: 7
          name: Slightshot-windows-arm64
          path: Windows/artifacts/win-arm64
          if-no-files-found: error
